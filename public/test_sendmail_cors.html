<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sendmail CORS Test</title>
    <style>
        body { margin: 0; padding: 32px 16px; background: #f3f5f7; color: #1d2733; font: 15px/1.5 system-ui, sans-serif; }
        main { max-width: 560px; margin: 0 auto; padding: 24px; background: #fff; border: 1px solid #d7dde4; border-radius: 8px; }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0 0 20px; color: #526170; }
        label { display: block; margin: 14px 0; font-weight: 600; }
        input, textarea { display: block; box-sizing: border-box; width: 100%; margin-top: 5px; padding: 9px 10px; border: 1px solid #aeb9c5; border-radius: 4px; font: inherit; }
        textarea { min-height: 90px; resize: vertical; }
        button { padding: 9px 14px; border: 0; border-radius: 4px; background: #145da0; color: #fff; font: inherit; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        pre { min-height: 48px; margin: 16px 0 0; padding: 12px; overflow-wrap: anywhere; white-space: pre-wrap; background: #edf1f5; border-radius: 4px; }
    </style>
</head>
<body>
    <main>
        <h1>Sendmail CORS Test</h1>
        <p>Clicking the button sends a real test email. The JSON request triggers a browser CORS preflight.</p>
        <form id="testForm">
            <label>Endpoint
                <input id="endpoint" type="url" value="http://support.texolenergies.com/sendmail.php" required>
            </label>
            <label>To
                <input id="recipient" type="email" value="gadafingowa067@gmail.com" readonly>
            </label>
            <label>Subject
                <input id="subject" value="Sendmail CORS test" required>
            </label>
            <label>Message
                <textarea id="body">This is a test email sent from the sendmail CORS test page.</textarea>
            </label>
            <button id="sendButton" type="submit">Send test email</button>
        </form>
        <pre id="result" role="status" aria-live="polite">Ready. No email has been sent.</pre>
    </main>
    <script>
        const form = document.getElementById('testForm');
        const sendButton = document.getElementById('sendButton');
        const result = document.getElementById('result');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            sendButton.disabled = true;
            result.textContent = 'Sending request; the browser is performing CORS checks...';

            try {
                const response = await fetch(document.getElementById('endpoint').value.trim(), {
                    method: 'POST',
                    mode: 'cors',
                    credentials: 'omit',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        to: document.getElementById('recipient').value,
                        subject: document.getElementById('subject').value,
                        body: document.getElementById('body').value
                    })
                });
                const responseText = await response.text();
                result.textContent = `HTTP ${response.status}\n${responseText || '(empty response)'}`;
            } catch (error) {
                result.textContent = `CORS/network failure: ${error.message}\nCheck the browser console and Network tab for the OPTIONS preflight response.`;
            } finally {
                sendButton.disabled = false;
            }
        });
    </script>
</body>
</html>
